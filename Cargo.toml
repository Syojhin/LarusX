[package]
name = "larusx"
version = "0.1.0"
edition = "2021"
authors = ["Syojhin", "Lara"]
description = "High-performance, zero-overhead competitive display color grading, Black Equalizer, and subpixel crosshair HUD for Windows."
license = "MIT"
readme = "README.md"
keywords = ["gaming", "crosshair", "color-grading", "vibrance", "black-equalizer"]
categories = ["games", "gui", "multimedia"]

[dependencies]
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "glow",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
